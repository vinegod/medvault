services:
  medvault:
    build: .
    container_name: medvault
    restart: unless-stopped
    # PORT and BIND_ADDR come from .env. The server listens on PORT inside
    # the container too, so both sides of the mapping use the same value.
    ports:
      - "${BIND_ADDR:-0.0.0.0}:${PORT:-8080}:${PORT:-8080}"
    volumes:
      - medvault-data:/app/data
    env_file:
      - .env
    environment:
      - DB_PATH=/app/data/medvault.db
      - PORT=${PORT:-8080}

volumes:
  medvault-data:
