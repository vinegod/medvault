repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    - id: check-yaml
      # Uses the compose-only !reset tag.
      exclude: ^docker-compose\.caddy\.yml$
    - id: end-of-file-fixer
      exclude: ^backend/static/
    - id: trailing-whitespace
    - id: check-added-large-files
    - id: detect-private-key
    - id: mixed-line-ending
      args: [--fix=lf]

  - repo: https://github.com/dnephin/pre-commit-golang
    rev: v0.5.1
    hooks:
      - id: go-cyclo
        args: [-over=15]
      - id: no-go-testing

  - repo: local
    hooks:
      - id: go-mod-tidy
        name: go mod tidy
        entry: bash -c 'cd backend && go mod tidy'
        language: system
        pass_filenames: false
        files: \.go$

      - id: go-build
        name: go build
        entry: bash -c 'cd backend && go build ./...'
        language: system
        pass_filenames: false
        files: \.go$

      - id: golangci-lint
        name: golangci-lint
        entry: bash -c 'cd backend && golangci-lint run ./...'
        language: system
        pass_filenames: false
        files: \.go$

      - id: tsc
        name: TypeScript type check
        entry: bash -c 'cd frontend && npx tsc --noEmit'
        language: system
        pass_filenames: false
        files: \.(ts|tsx)$

      - id: eslint
        name: ESLint
        entry: bash -c 'cd frontend && npx eslint src/'
        language: system
        pass_filenames: false
        files: \.(ts|tsx)$

      - id: prettier
        name: Prettier
        entry: bash -c 'cd frontend && npx prettier --check src/'
        language: system
        pass_filenames: false
        files: \.(ts|tsx|css|json)$

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  # I prefer this over https://github.com/koalaman/shellcheck-precommit
  # because this does not requires docker
  - repo: https://github.com/Jarmos-san/shellcheck-precommit
    rev: v0.2.0
    hooks:
      - id: shellcheck-system
